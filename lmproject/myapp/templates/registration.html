{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="{% static 'css/registration.css' %}">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Student Registration</h2>
            <form action="{% url 'registration' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="input-group">
                    <label>username</label>
                    <input type="text" name="username" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="Enter your phone number" required>
                </div>
                <div class="input-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="" disabled selected>Select your gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Date of Birth</label>
                    <input type="date" name="dob" required>
                </div>
                <div class="input-group">
                    <label>Class</label>
                    <select name="class" required>
                        <option value="" disabled selected>Select your class</option>
                        <option value="1">Class 1</option>
                        <option value="2">Class 2</option>
                        <option value="3">Class 3</option>
                        <option value="4">Class 4</option>
                        <option value="5">Class 5</option>
                        <option value="6">Class 6</option>
                        <option value="7">Class 7</option>
                        <option value="8">Class 8</option>
                        <option value="9">Class 9</option>
                        <option value="10">Class 10</option>
                        <option value="11">Class 11</option>
                        <option value="12">Class 12</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Address</label>
                    <input type="text"  name= "Address" placeholder="Enter your address" required>
                </div>
                <div class="input-group">
                    <label>Profile Picture</label>
                    <input type="file" name="Profile Picture" required>
                </div>
                <label for="password">Password:</label>
                <input type="password" name="password">
                <br>
                <label for="password">Con_Password:</label>
                <input type="password" name="cpassword">
                <button type="submit">Register</button>
            </form>
        </div>
    </div>
</body>
</html>
