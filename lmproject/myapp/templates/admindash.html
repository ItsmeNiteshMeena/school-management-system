
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/admindash.css' %}">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
     {% include "adminbase.html" %}
    <div class="main-content">
        <header>
            <h2>Dashboard</h2>
            <div class="user-info">
                <span>Admin</span>
                <i class="fas fa-user-circle"></i>
            </div>
        </header>
        <section class="cards">
            <div class="card">
                <h3>Total Students :  {{ student_count }}</h3>   
            </div>
            <div class="card">
                <h3>Total Teachers :  {{ teacher_count }}</h3>   
            </div>
            <div class="card">
                <h3>Total Classes</h3>  
            </div>
        </section>   
    </div>
</body>
</html>
