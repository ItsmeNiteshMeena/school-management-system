{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Scheduled Timetables</title>
    <link rel="stylesheet" href="{% static 'css/studash.css' %}">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .main-content {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        header h2 {
            font-size: 24px;
            color: #333;
        }

        header a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        .pdf-links h3 {
            margin-bottom: 20px;
            color: #444;
        }

        .pdf-card {
            background-color: #f9f9f9;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .pdf-card span {
            font-size: 18px;
            font-weight: 500;
            color: #222;
        }

        .btn-group a {
            text-decoration: none;
            margin-left: 10px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .view-btn {
            background-color: #4CAF50;
            color: white;
        }

        .download-btn {
            background-color: #007BFF;
            color: white;
        }

        .view-btn:hover {
            background-color: #45a049;
        }

        .download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <header>
            <h2>📅 Scheduled notices </h2>
            <a href="{% url 'stulogin' %}">← Back to Dashboard</a>
        </header>
        
        <section class="pdf-links">
            <h3>Available Timetables:</h3>

            <div class="pdf-card">
                <span>📘 Class Timetable</span>
                <div class="btn-group">
                    <a href="{% static 'pdfs/class_timetable.pdf' %}" target="_blank" class="view-btn">View</a>
                    <a href="{% static 'pdfs/class_timetable.pdf' %}" download="Class_Timetable.pdf" class="download-btn">Download</a>
                </div>
            </div>

            <div class="pdf-card">
                <span>📝 Exam Timetable</span>
                <div class="btn-group">
                    <a href="{% static 'pdfs/exam_timetable.pdf' %}" target="_blank" class="view-btn">View</a>
                    <a href="{% static 'pdfs/exam_timetable.pdf' %}" download="Exam_Timetable.pdf" class="download-btn">Download</a>
                </div>
            </div>

            <div class="pdf-card">
                <span>🎉 Event Timetable</span>
                <div class="btn-group">
                    <a href="{% static 'pdfs/event_timetable.pdf' %}" target="_blank" class="view-btn">View</a>
                    <a href="{% static 'pdfs/event_timetable.pdf' %}" download="Event_Timetable.pdf" class="download-btn">Download</a>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
